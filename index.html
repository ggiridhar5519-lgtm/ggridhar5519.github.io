<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giridhar Rao</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

/* ===== MATRIX BACKGROUND ===== */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* ===== SVG TEXT ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

svg {
  width: 90%;
  max-width: 1000px;
}

/* TEXT STROKE */
text {
  font-size: 120px;
  font-weight: 900;
  font-style: italic;
  fill: transparent;
  stroke: #00ffcc;
  stroke-width: 4;
  stroke-dasharray: 1200;
  stroke-dashoffset: 1200;
  animation: write 2.5s ease forwards, pop3d 2.5s ease forwards;
}

/* DRAW EFFECT */
@keyframes write {
  to {
    stroke-dashoffset: 0;
  }
}

/* 3D POP */
@keyframes pop3d {
  0% {
    transform: scale(0.7) translateZ(-200px);
    opacity: 0;
  }
  100% {
    transform: scale(1) translateZ(0);
    opacity: 1;
  }
}

/* FILL + GLOW */
.fill {
  animation: fillColor 1s forwards;
}

@keyframes fillColor {
  to {
    fill: #00ffcc;
    stroke: #00ffcc;
    filter: drop-shadow(0 0 20px #00ffcc)
            drop-shadow(0 0 40px #00ffcc);
  }
}

/* EXIT */
.fadeOut {
  animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(1.1);
  }
}
</style>
</head>

<body>

<!-- MATRIX CANVAS -->
<canvas id="matrix"></canvas>

<!-- INTRO -->
<div id="intro">
  <svg viewBox="0 0 1000 200">
    <text id="text" x="50" y="130">WELCOME</text>
  </svg>
</div>

<script>

/* ===== MATRIX EFFECT ===== */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let i = 0; i < columns; i++) {
  drops[i] = 1;
}

function drawMatrix() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ffcc";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(drawMatrix, 50);

/* ===== TEXT EFFECT ===== */
const textEl = document.getElementById("text");
const intro = document.getElementById("intro");

/* AFTER DRAW → FILL + GLOW */
setTimeout(() => {
  textEl.classList.add("fill");
}, 2600);

/* EXIT */
setTimeout(() => {
  intro.classList.add("fadeOut");
  setTimeout(() => {
    intro.style.display = "none";
  }, 1000);
}, 4500);

</script>

</body>
</html>
