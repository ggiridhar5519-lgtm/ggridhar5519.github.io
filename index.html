<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giridhar Rao</title>

<style>
body {
  margin: 0;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* SVG TEXT */
svg {
  width: 80%;
  max-width: 800px;
}

/* WRITING EFFECT */
text {
  font-size: 100px;
  font-weight: 800;
  font-style: italic;
  fill: none;
  stroke: #0f172a;
  stroke-width: 3;
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: write 2.5s ease forwards;
}

/* ANIMATION */
@keyframes write {
  to {
    stroke-dashoffset: 0;
  }
}

/* EXIT */
.fadeOut {
  animation: fadeOut 0.8s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <svg viewBox="0 0 800 200">
    <text x="50" y="120">WELCOME</text>
  </svg>
</div>

<script>
const intro = document.getElementById("intro");

/* EXIT AFTER DRAW */
setTimeout(() => {
  intro.classList.add("fadeOut");
  setTimeout(() => {
    intro.style.display = "none";
  }, 800);
}, 3200);
</script>

</body>
</html>
