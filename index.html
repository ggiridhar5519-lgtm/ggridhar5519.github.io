<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giridhar Rao</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
}

/* ===== INTRO ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  z-index: 9999;
}

/* LEFT BLACK */
.left {
  width: 50%;
  background: #000;
}

/* RIGHT WHITE */
.right {
  width: 50%;
  background: #fff;
}

/* CENTER TEXT */
.center-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  font-size: 80px;
  font-weight: 700;
  font-style: italic;
  letter-spacing: 6px;
  opacity: 0;
  animation: zoomText 1.5s ease forwards;
}

/* COLOR SPLIT TEXT */
.center-text span:first-child {
  color: white;
}

.center-text span:last-child {
  color: black;
}

/* TEXT ANIMATION ONLY */
@keyframes zoomText {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

/* EXIT */
.fadeOut {
  animation: fadeOut 0.8s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
  }
}

/* ===== HOME ===== */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #ffffff;
}

section {
  padding: 60px 30px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="left"></div>
  <div class="right"></div>

  <div class="center-text">
    <span>WEL</span><span>COME</span>
  </div>
</div>

<!-- HOME -->
<nav>
  <div><strong>Giridhar Rao</strong></div>
  <div>Home About Projects Contact</div>
</nav>

<section>
  <h1>Home Page</h1>
</section>

<script>
const intro = document.getElementById("intro");

/* REMOVE INTRO */
setTimeout(() => {
  intro.classList.add("fadeOut");
  setTimeout(() => {
    intro.style.display = "none";
  }, 800);
}, 3000);
</script>

</body>
</html>
