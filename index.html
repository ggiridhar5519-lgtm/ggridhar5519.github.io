<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giridhar Rao</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
}

/* ===== INTRO ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  z-index: 9999;
}

/* SPLIT BACKGROUND */
.left {
  width: 50%;
  background: #000;
}

.right {
  width: 50%;
  background: #fff;
}

/* TEXT WRAPPER */
.text-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* MAIN TEXT */
.split-text {
  font-size: 90px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: 8px;
  position: relative;
  animation: zoomIn 1.2s ease forwards;
}

/* LEFT PART (WHITE ON BLACK) */
.split-text::before {
  content: "WELCOME";
  position: absolute;
  color: white;
  clip-path: inset(0 50% 0 0);
}

/* RIGHT PART (BLACK ON WHITE) */
.split-text::after {
  content: "WELCOME";
  position: absolute;
  color: black;
  clip-path: inset(0 0 0 50%);
}

/* HIDE ORIGINAL */
.split-text span {
  visibility: hidden;
}

/* ANIMATION */
@keyframes zoomIn {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* EXIT */
.fadeOut {
  animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
  }
}

/* ===== HOME ===== */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #ffffff;
}

section {
  padding: 60px 30px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="left"></div>
  <div class="right"></div>

  <div class="text-wrapper">
    <div class="split-text">
      <span>WELCOME</span>
    </div>
  </div>
</div>

<!-- HOME -->
<nav>
  <div><strong>Giridhar Rao</strong></div>
  <div>Home About Projects Contact</div>
</nav>

<section>
  <h1>Home Page</h1>
</section>

<script>
const intro = document.getElementById("intro");

setTimeout(() => {
  intro.classList.add("fadeOut");
  setTimeout(() => {
    intro.style.display = "none";
  }, 600);
}, 3000);
</script>

</body>
</html>
