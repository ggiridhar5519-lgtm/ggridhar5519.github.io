<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giridhar Rao</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  overflow-x: hidden;

  /* PREMIUM GRADIENT */
  background: linear-gradient(135deg,#dbeafe,#fbcfe8,#c7d2fe);
  background-size: 200% 200%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* ===== INTRO ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
}

#intro h1 {
  font-size: 42px;
  letter-spacing: 8px;
  animation: zoomIn 1.5s ease;
}

#intro p {
  color: #38bdf8;
}

@keyframes zoomIn {
  from {opacity:0; transform: scale(0.7);}
  to {opacity:1; transform: scale(1);}
}

/* ===== NAVBAR ===== */
#navbar {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
}

.logo {
  font-weight: 600;
}

/* LINKS */
.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  text-decoration: none;
  color: black;
  position: relative;
}

/* UNDERLINE EFFECT */
.nav-links a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  bottom: -4px;
  left: 0;
  background: #0ea5e9;
  transition: 0.3s;
}

.nav-links a:hover::after {
  width: 100%;
}

/* MOBILE */
.menu-toggle {
  display: none;
  font-size: 22px;
  cursor: pointer;
}

@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .nav-links {
    position: absolute;
    top: 60px;
    right: 0;
    background: white;
    flex-direction: column;
    display: none;
    width: 200px;
  }

  .nav-links a {
    padding: 15px;
    border-bottom: 1px solid #eee;
  }

  .nav-links.show {
    display: flex;
  }
}

/* ===== HOME ===== */
#home {
  display: none;
}

.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* PROFILE */
.hero img {
  width: 160px;
  border-radius: 50%;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.hero h1 {
  margin: 15px 0 5px;
  font-size: 32px;
}

.hero p {
  color: #64748b;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>GIRIDHAR RAO</h1>
  <p>SAP CPI CONSULTANT</p>
</div>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="logo">Giridhar Rao</div>

  <div class="nav-links" id="navLinks">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </div>

  <div class="menu-toggle" id="menuToggle">☰</div>
</nav>

<!-- HOME -->
<div id="home">
  <div class="hero">
    <img src="profile.png">
    <h1>Giridhar Rao</h1>
    <p>SAP CPI Consultant | 6+ Years Experience</p>
  </div>
</div>

<script>
/* INTRO */
const intro = document.getElementById("intro");
const home = document.getElementById("home");

setTimeout(() => {
  intro.style.display = "none";
  home.style.display = "block";
}, 2000);

/* MOBILE MENU */
const toggle = document.getElementById("menuToggle");
const links = document.getElementById("navLinks");

toggle.addEventListener("click", () => {
  links.classList.toggle("show");
});
</script>

</body>
</html>
