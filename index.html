<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giridhar Rao</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #f8fafc; /* SAP-like light background */
  font-family: Arial, sans-serif;
}

/* ===== SUBTLE BACKGROUND ===== */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  opacity: 0.15; /* very subtle */
}

/* ===== INTRO ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

/* TEXT */
text {
  font-size: 110px;
  font-weight: 700;
  font-style: italic;
  fill: transparent;
  stroke: #0ea5e9; /* SAP blue */
  stroke-width: 2.5;
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: write 1.8s ease forwards;
}

/* WRITE */
@keyframes write {
  to {
    stroke-dashoffset: 0;
  }
}

/* FILL */
.fill {
  animation: fillColor 0.6s ease forwards;
}

@keyframes fillColor {
  to {
    fill: #0ea5e9;
    stroke: #0ea5e9;
  }
}

/* EXIT */
.fadeOut {
  animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
  }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="intro">
  <svg viewBox="0 0 1000 200">
    <text id="text" x="50" y="130">WELCOME</text>
  </svg>
</div>

<script>

/* ===== VERY SUBTLE BACKGROUND ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function drawDots() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = "#0ea5e9";
    ctx.globalAlpha = 0.05;
    ctx.beginPath();
    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

setInterval(drawDots, 800);

/* ===== TEXT FLOW ===== */
const textEl = document.getElementById("text");
const intro = document.getElementById("intro");

/* fill quickly */
setTimeout(() => {
  textEl.classList.add("fill");
}, 1800);

/* fast exit */
setTimeout(() => {
  intro.classList.add("fadeOut");
  setTimeout(() => {
    intro.style.display = "none";
  }, 600);
}, 2800);

</script>

</body>
</html>
